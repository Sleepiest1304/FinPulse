name: Evaluate models

# Manually triggered: scores Financial PhraseBank with FinBERT, VADER and a
# majority-class baseline, then commits results/model_eval.{json,md}.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-finbert-v1
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Evaluate
        run: python -m finpulse evaluate
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/model_eval.json results/model_eval.md
          git diff --cached --quiet || { git commit -m "results: model evaluation [skip ci]"; git push; }

name: Collect headlines

# Fetches and scores Nifty 50 headlines, then commits the updated SQLite
# database back to the repo so sentiment history accumulates over time.
on:
  schedule:
    # 03:30 and 11:30 UTC = 09:00 and 17:00 IST, Monday to Friday
    - cron: "30 3,11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache Hugging Face model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-finbert-v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect and score
        run: python -m finpulse collect

      - name: Refresh backtest results
        # Needs price data; a failure here should not block saving headlines.
        continue-on-error: true
        run: python -m finpulse backtest

      - name: Commit database and results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/finpulse.db
          git add results/backtest_summary.csv results/backtest_panel.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new headlines."
          else
            git commit -m "data: collect headlines $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push
          fi

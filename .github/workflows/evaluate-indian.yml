name: Evaluate models (Indian headlines)

# Manually triggered. Compares a majority baseline, VADER, FinBERT and a
# zero-shot NLI model on hand-labelled Indian headlines. The labels file holds
# only GDELT record ids and labels; titles are looked up again from GDELT here,
# so no third-party headline text is stored in the repository.
on:
  workflow_dispatch:
    inputs:
      labels:
        description: "Labels CSV (record_id,label)"
        default: data/labels/indian_headlines_v1.csv

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-finbert-bartmnli-v1
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Evaluate
        env:
          LABELS: ${{ inputs.labels }}
        run: python -m finpulse evaluate --labelled "$LABELS"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/model_eval_indian.json results/model_eval_indian.md
          git diff --cached --quiet || { git commit -m "results: Indian headline model evaluation [skip ci]"; git push; }
